name: Windows x64 release
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Build and test Windows x64
    timeout-minutes: 25
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set version from commit height
        run: node scripts/version.cjs
      - name: Install dependencies
        run: npm ci
      - name: Check source and unit tests
        run: npm run check
      - name: Test desktop interactions
        run: npm run test:desktop
      - name: Build the Windows x64 installer
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Verify and test the packaged app
        run: npm run test:packaged -- win32 x64
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Petex-win32-x64
          path: release/Petex-*-win-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-win32-x64
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  release:
    name: Publish release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: Petex-win32-x64
          path: release
      - name: Set version from commit height
        run: node scripts/version.cjs
      - name: Publish this version once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: node scripts/release.cjs
